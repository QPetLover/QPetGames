<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏运行 · QPet Games</title>
</head>
<body>
  <p>正在跳转到新版游戏运行页...</p>
  <p><a id="fallback" href="../index.html#/games?kind=reskin">返回 QPet Games</a></p>
  <script>
    const title = new URLSearchParams(location.search).get('game') || '';
    fetch('../assets/data/games.json')
      .then((response) => response.json())
      .then((data) => {
        const game = data.games.find((item) => item.title === title || item.baseTitle === title);
        const target = game && game.playable
          ? `../index.html#/play/${encodeURIComponent(game.id)}`
          : `../index.html#/games?kind=reskin&search=${encodeURIComponent(title)}`;
        document.getElementById('fallback').href = target;
        location.replace(target);
      })
      .catch(() => {
        location.replace(`../index.html#/games?kind=reskin&search=${encodeURIComponent(title)}`);
      });
  </script>
</body>
</html>
